<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pet.nome})}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('vet', 'pets')}"></div>

    <main class="app-main">
        <div class="container">

            <div th:if="${mensagem}" class="flash" th:classappend="${tipoFlash}" th:text="${mensagem}"></div>

            <div class="page-head">
                <div>
                    <div class="eyebrow"><span class="pulse-dot"></span> Ficha clínica · Clyvo Vet</div>
                    <h1 th:text="${pet.nome}">Nome</h1>
                    <p class="sub" th:text="${pet.nomeEspecie} + (${pet.raca} != null ? ' · ' + ${pet.raca} : '') + ' · tutor: ' + ${pet.nomeTutor}">Detalhes</p>
                </div>
                <a th:href="@{/vet/pets}" class="btn btn-ghost">← Todos os pets</a>
            </div>

            <div class="grid grid-2">
                <div class="card">
                    <div class="card-title">Alertas recentes</div>

                    <div th:if="${#lists.isEmpty(alertas)}" class="empty" style="padding:20px;">
                        <p>Nenhum alerta gerado até agora para este pet.</p>
                    </div>

                    <div th:each="alerta : ${alertas}"
                         class="alert-row"
                         th:classappend="${alerta.nivel.name().toLowerCase()}">
                        <div>
                            <span class="badge" th:classappend="${alerta.resolvido} ? 'ok' : ${alerta.nivel.name().toLowerCase()}">
                                <span class="dot"></span>
                                <span th:text="${alerta.resolvido} ? 'Resolvido' : ${alerta.nivel}">NIVEL</span>
                            </span>
                        </div>
                        <div>
                            <div class="msg" th:text="${alerta.mensagem}">Mensagem</div>
                            <div class="meta" th:text="${#temporals.format(alerta.dataHoraGerado, 'dd/MM/yyyy HH:mm')} + (${alerta.resolvido} ? ' · resolvido pela clínica' : ' · aguardando avaliação')">Meta</div>
                        </div>
                        <div>
                            <form th:if="${!alerta.resolvido}" th:action="@{/vet/alertas/{id}/resolver(id=${alerta.id})}" method="post">
                                <button type="submit" class="btn btn-sm btn-primary">Marcar resolvido</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Linha do tempo de eventos</div>

                    <div th:if="${#lists.isEmpty(eventos)}" class="empty" style="padding:20px;">
                        <h3>Nenhum evento registrado</h3>
                        <p>O tutor ainda não registrou nenhum evento para <span th:text="${pet.nome}"></span>.</p>
                    </div>

                    <div class="timeline">
                        <div class="timeline-item" th:each="evento : ${eventos}">
                            <div class="timeline-time" th:text="${#temporals.format(evento.dataHora, 'dd/MM HH:mm')}">data</div>
                            <div class="timeline-rail"><div class="timeline-node"></div></div>
                            <div class="timeline-body">
                                <strong th:text="${evento.tipo}">TIPO</strong>
                                <p th:if="${evento.observacao}" th:text="${evento.observacao}">obs</p>
                                <div class="timeline-origin" th:text="${evento.origem == 'SENSOR_IOT'} ? '📡 sensor IoT' : '✍️ registro manual'">origem</div>
                                <form th:action="@{/vet/pets/{petId}/eventos/{id}/excluir(petId=${pet.id},id=${evento.id})}" method="post"
                                      onsubmit="return confirm('Remover este evento da linha do tempo?');"
                                      style="margin-top:8px;">
                                    <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
