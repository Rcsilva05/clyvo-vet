<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Todos os pets')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('vet', 'pets')}"></div>

    <main class="app-main">
        <div class="container">

            <div class="page-head">
                <div>
                    <div class="eyebrow"><span class="pulse-dot"></span> Base de pacientes</div>
                    <h1>Todos os pets</h1>
                    <p class="sub">Visão geral de todos os pets monitorados pela Clyvo Vet através do SOLIN.</p>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Pet</th>
                            <th>Espécie</th>
                            <th>Raça</th>
                            <th>Tutor</th>
                            <th>Peso</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pet : ${pets}" style="cursor:pointer;" onclick="window.location.href=this.dataset.href"
                            th:data-href="@{/vet/pets/{id}(id=${pet.id})}">
                            <td><a th:href="@{/vet/pets/{id}(id=${pet.id})}" th:text="${pet.nome}" style="color:var(--pulse-soft); font-weight:600;">Nome</a></td>
                            <td th:text="${pet.nomeEspecie}">Espécie</td>
                            <td th:text="${pet.raca ?: '—'}">Raça</td>
                            <td th:text="${pet.nomeTutor}">Tutor</td>
                            <td th:text="${pet.pesoKg != null ? pet.pesoKg + ' kg' : '—'}">Peso</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
</body>
</html>
