spring.application.name=solin-api

# ===== Servidor =====
server.port=8080
server.servlet.context-path=/solin

# ===== Banco de dados (PostgreSQL) =====
# Em execucao local: suba o Postgres com "docker compose up -d" (ver docker-compose.yml)
# As credenciais podem ser sobrescritas por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/solindb}
spring.datasource.username=${DB_USER:solin}
spring.datasource.password=${DB_PASSWORD:solin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# O Flyway e quem cria/versiona o schema. O Hibernate so valida se bate com o que o Flyway criou.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Paginacao =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===== Swagger =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== Cache (simples, em memoria) =====
spring.cache.type=simple

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
